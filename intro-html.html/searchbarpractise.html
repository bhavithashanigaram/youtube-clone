<!DOCTYPE html>
<html>
  <head>
    <style>
      .search-bar{
        width:182px ;
        height:36px;
        border-color: rgb(165, 162, 162);
        border-radius: 9px;
        border-width:1.5px;
        border-style:solid ;
        font-size:20px ;
      }
      .search-bar2{
        margin-left: 15px ;
        width: 350px;
        height:32px;
        border:0;
        border-radius: 30px;
        box-shadow:2px 2px 7px rgba(129, 125, 125, 0.5)
      
      }
      .email{
        color: rgb(131, 125, 125);
        margin-bottom: 5px;
        font-family: Arial;
        font-size: small;
      }

      .email-box{
        width:250px;
        height:20px;
        border-color: black;
        border-width: 1.5px;
        margin-top:0;
      }
      .sentence{
        font-family: Arial;
        font-size: small;
        color: rgb(131, 125, 125);

      }
      .button1{
        color: white;
        border:0;
        background-color: rgb(41, 41, 223);
        width: 250px;
        height: 40px;
        border-radius: 20px;

      }
      .image{
        width:66px;
        margin-left: 0;
        border-radius: 35px;
        vertical-align:middle;
        margin-right: 0;
        margin-top:20px;
      
      }
      .sentence2{
        color:rgb(131, 125, 125);
        vertical-align:middle;
        margin-left:5px;
        margin-top:30px;
        width: 137px; 
        display: inline-block;
        margin-right:0;

      }
      .button2{
        border:0;
        margin-top:20px;
        font-family:Arial;
        width:70px;
        height: 30px;
        color:white;
        border-radius:15px;
        margin-left:0;
        display: inline-block;
        vertical-align:middle;
        background-color:rgb(76, 76, 219) ;
      }

    </style>

  </head>
  <body>
    <input class="search-bar" type="text" placeholder="  Search">
    <input class="search-bar2" type="text" placeholder="  Search Google or type a URL" >
    
    <p class="email">Email</p>
    <input class="email-box" type="text" >
    <p class="sentence">By clicking Agree & Join,you agree to the Privacy Policy.</p>
    <button class="button1">Agree & Join</button>
    <div>
    <img class="image" src="cat.png"> 
    <p class="sentence2">what's happening?</p>
    <button class="button2">Tweet</button>
    </div>
 </body>


</html>
