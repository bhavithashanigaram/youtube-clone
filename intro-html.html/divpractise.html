<!DOCTYPE html>
<html>
  <head>
  <style>
    .div-square{
      width: 40px;
      height:40px;
      background-color: red;
      display: inline-block;
    }
    .div-circle{
      background-color: green;
      width: 40px;
      height:40px;
      border-radius: 20px;
    }
    .div-box{
      width:300px;
      display: inline-block;
      border-color: black;
      border-style: solid;
      border-width:1px;
      height:80px;
    }
    .line1{
     margin-left:15px;
     margin-bottom:9px;

    }
    .yes{
      margin-left: 15px;
      margin-bottom:3px;
    }
    .no{
     margin-left: 3px;
     margin-bottom:3px;
    }
    .install{
      margin-top:30px;
      font-family: Arial;
      font-size: large;
      font-weight: bold;
      color:white;
      margin-left: 10px;
    }
    .add-line{
      margin-top:5px;
      font-family: Arial;
      width:350px ;
      display: inline-block;
      color:rgb(208, 202, 202);
      margin-left:10px;
      font-size: small;
    }
    .youtube{
      background-color:black;
      display: inline-block ;
      margin-left: 200px;
      margin-top:90px;
    }

  </style>
  </style>
  </head>
  <div class="div-square">
  </div>

  <div class="div-circle">
  </div>
  <div class="div-box">
    <p class="line1">Satisfies with our service?</p>
    <button class="yes">Yes</button>
    <button class="no">No</button>
  </div>

  <div class="youtube">
    <p class="install">Install Youtube Music</p>
    <p class="add-line">Add Youtube Music to your desktop for quick and easy access</p>

  </div>
</html>
